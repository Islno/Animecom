<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultados da Busca</title>
    <style>
        /* Reutilizando o mesmo CSS da Home para manter a identidade */
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }

        .header-busca { display: flex; align-items: center; justify-content: space-between; max-width: 1000px; margin: 0 auto; }
        .btn-voltar { text-decoration: none; color: #333; font-weight: bold; border: 1px solid #ccc; padding: 8px 15px; border-radius: 5px; background: white; }
        .btn-voltar:hover { background: #eee; }

        .grade-animes { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .card { background: white; width: 150px; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
        .titulo-card { font-size: 14px; font-weight: bold; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .paginacao { margin-top: 40px; margin-bottom: 50px; }
        .btn-nav { padding: 8px 15px; background: #333; color: white; text-decoration: none; border-radius: 4px; margin: 0 5px; }
        .btn-nav.disabled { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<div class="header-busca">
    <a href="/" class="btn-voltar">⬅ Voltar para Home</a>
    <h2>Resultados para: "<span th:text="${termoBuscado}">Termo</span>"</h2>
    <div style="width: 80px;"></div> </div>

<hr>

<div class="grade-animes">
    <div th:each="anime : ${listaDeAnimes.content}" class="card">
        <a th:href="@{/anime/{id}(id=${anime.id})}" style="text-decoration: none; color: inherit;">
            <img th:src="${anime.imagemUrl}" onerror="this.src='https://via.placeholder.com/150'">
            <p class="titulo-card" th:text="${anime.titulo}">Nome</p>
            <div style="font-size: 12px; color: orange;">
                ★ <span th:text="${anime.nota}"></span>
            </div>
        </a>
    </div>

    <div th:if="${listaDeAnimes.totalElements == 0}" style="margin-top: 50px; color: #666;">
        <h3>😕 Nenhum anime encontrado com esse nome.</h3>
    </div>
</div>

<div class="paginacao" th:if="${listaDeAnimes.totalPages > 1}">
    <a th:href="@{/buscar(titulo=${termoBuscado}, page=${paginaAtual - 1})}"
       class="btn-nav" th:classappend="${paginaAtual == 0} ? 'disabled'">⬅ Anterior</a>

    <span>Página <strong th:text="${paginaAtual + 1}"></strong></span>

    <a th:href="@{/buscar(titulo=${termoBuscado}, page=${paginaAtual + 1})}"
       class="btn-nav" th:classappend="${paginaAtual + 1 >= totalPaginas} ? 'disabled'">Próximo ➡</a>
</div>

</body>
</html>
