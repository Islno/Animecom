<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultados - AnimeCom</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-color: #f1f5f9; --accent-color: #6366f1; --score-color: #fbbf24; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header-area { width: 100%; max-width: 1200px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .btn-back { display: flex; align-items: center; gap: 5px; color: #94a3b8; text-decoration: none; font-weight: 600; transition: 0.2s; }
        .btn-back:hover { color: var(--accent-color); }
        h2 { font-weight: 400; }

        .grade-animes { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; width: 100%; max-width: 1200px; }
        .card { background-color: var(--card-bg); width: 180px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.3s ease; }
        .card:hover { transform: translateY(-5px); }
        .card a { text-decoration: none; color: inherit; }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card-content { padding: 15px; }
        .titulo-card { font-size: 14px; font-weight: 600; margin: 0 0 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge-nota { background: rgba(251, 191, 36, 0.1); color: var(--score-color); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }

        .paginacao { margin-top: 50px; display: flex; gap: 10px; align-items: center; }
        .btn-nav { background: var(--card-bg); color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; border: 1px solid #334155; }
        .btn-nav:hover { background: var(--accent-color); border-color: var(--accent-color); }
        .btn-nav.disabled { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<div class="header-area">
    <a href="/" class="btn-back">⬅ Voltar</a>
    <h2>Resultados para: "<span th:text="${termoBuscado}">Termo</span>"</h2>
    <div></div>
</div>

<div class="grade-animes">
    <div th:each="anime : ${listaDeAnimes.content}" class="card">
        <a th:href="@{'/anime/' + ${anime.id} + '-' + ${anime.titulo.replaceAll('[^a-zA-Z0-9]', '-').replaceAll('--+', '-')}}">
            <img th:src="${anime.imagemUrl}" onerror="this.src='https://via.placeholder.com/180x250'">
            <div class="card-content">
                <p class="titulo-card" th:text="${anime.titulo}">Nome</p>
                <span class="badge-nota">★ <span th:text="${anime.nota}"></span></span>
            </div>
        </a>
    </div>

    <div th:if="${listaDeAnimes.totalElements == 0}" style="text-align: center; width: 100%; margin-top: 50px;">
        <h3>😕 Nenhum anime encontrado.</h3>
        <p style="color: #94a3b8;">Tente verificar a ortografia ou use palavras mais curtas.</p>
    </div>
</div>

<div class="paginacao" th:if="${listaDeAnimes.totalPages > 1}">
    <a th:href="@{/buscar(titulo=${termoBuscado}, page=${paginaAtual - 1})}" class="btn-nav" th:classappend="${paginaAtual == 0} ? 'disabled'">Anterior</a>
    <span style="color: #94a3b8;">Página <strong style="color: white;" th:text="${paginaAtual + 1}"></strong></span>
    <a th:href="@{/buscar(titulo=${termoBuscado}, page=${paginaAtual + 1})}" class="btn-nav" th:classappend="${paginaAtual + 1 >= totalPaginas} ? 'disabled'">Próxima</a>
</div>

</body>
</html>
