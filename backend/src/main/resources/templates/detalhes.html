<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${anime.titulo}">Detalhes</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        .poster { max-width: 300px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .sinopse { max-width: 600px; margin: 20px auto; text-align: justify; }
        .voltar { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #333; color: white; text-decoration: none; border-radius: 5px;}
    </style>
</head>
<body>

<h1 th:text="${anime.titulo}">Título do Anime</h1>

<img th:src="${anime.imagemUrl}" class="poster" alt="Poster">

<p><strong>Nota:</strong> <span th:text="${anime.nota}">0.0</span> | <strong>Episódios:</strong> <span th:text="${anime.episodios}">0</span></p>

<h3>Sinopse</h3>
<p class="sinopse" th:text="${anime.sinopse}">Texto da sinopse...</p>

<div th:if="${anime.trailerUrl != null}">
    <h3>Trailer</h3>
    <iframe width="560" height="315" th:src="${anime.trailerUrl}" frameborder="0" allowfullscreen></iframe>
</div>

<br>
<a href="/" class="voltar">⬅ Voltar para a Home</a>

</body>
</html>
