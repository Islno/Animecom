<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${anime.titulo}">Detalhes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-color: #f1f5f9; --accent-color: #6366f1; --score-color: #fbbf24; }

        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }

        .container { max-width: 1000px; width: 90%; margin: 50px 0; }

        .btn-voltar { display: inline-block; margin-bottom: 20px; color: #94a3b8; text-decoration: none; font-weight: 600; transition: 0.2s; }
        .btn-voltar:hover { color: var(--accent-color); transform: translateX(-5px); }

        .hero-section { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; }

        .poster-wrapper { flex: 0 0 300px; }
        .poster { width: 100%; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); border: 2px solid #334155; }

        .info-wrapper { flex: 1; min-width: 300px; }

        h1 { font-size: 2.5rem; margin: 0 0 10px 0; line-height: 1.1; }

        .meta-tags { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
        .tag { background: #334155; padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; }
        .tag.score { background: rgba(251, 191, 36, 0.2); color: var(--score-color); }

        .label { color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: 700; display: block; }
        .sinopse-box { background: var(--card-bg); padding: 20px; border-radius: 12px; line-height: 1.7; color: #cbd5e1; margin-bottom: 30px; border-left: 4px solid var(--accent-color); }

        .trailer-section { margin-top: 40px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; background: black; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        @media (max-width: 768px) {
            .hero-section { flex-direction: column; align-items: center; text-align: center; }
            .meta-tags { justify-content: center; }
            .poster-wrapper { width: 80%; }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="btn-voltar">⬅ Voltar para a Lista</a>

    <div class="hero-section">
        <div class="poster-wrapper">
            <img th:src="${anime.imagemUrl}" class="poster" alt="Poster do Anime"
                 onerror="this.src='https://via.placeholder.com/300x450?text=Sem+Imagem'">
        </div>

        <div class="info-wrapper">
            <h1 th:text="${anime.titulo}">Título do Anime</h1>

            <div class="meta-tags">
                <span class="tag score">★ <span th:text="${anime.nota}">0.0</span></span>
                <span class="tag">📺 <span th:text="${anime.episodios}">?</span> Episódios</span>
                <span class="tag">ID: <span th:text="${anime.id}">#</span></span>
            </div>

            <span class="label">Sinopse</span>
            <div class="sinopse-box" th:text="${anime.sinopse}">
                A sinopse do anime aparecerá aqui...
            </div>
        </div>
    </div>

    <div class="trailer-section" th:if="${anime.trailerUrl != null and anime.trailerUrl != ''}">
        <span class="label" style="margin-bottom: 15px;">Trailer Oficial</span>
        <div class="video-container">
            <iframe th:src="${anime.trailerUrl}" allowfullscreen title="Trailer"></iframe>
        </div>
    </div>
</div>

</body>
</html>
