<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AnimeCom</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }

        /* --- ESTILO DA BUSCA E BOTÃO --- */
        .search-wrapper { position: relative; display: inline-flex; gap: 5px; align-items: center; }
        input { width: 300px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }

        /* --- ESTILO DO POPUP FLUTUANTE (Modificado para imagem) --- */
        #popup-resultados {
            position: absolute;
            top: 100%;
            left: 0;
            width: 350px; /* Aumentei um pouco a largura para caber a imagem */
            background: white;
            border: 1px solid #ddd;
            z-index: 1000;
            display: none;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 0 0 5px 5px;
            max-height: 400px; /* Limite de altura caso tenha muitos resultados */
            overflow-y: auto; /* Barra de rolagem se passar da altura */
        }

        .item-popup {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }
        .item-popup:hover { background-color: #f0f0f0; }

        /* NOVO: Transforma o link num container flexível */
        .item-popup a {
            text-decoration: none;
            color: #333;
            display: flex;          /* Alinha imagem e texto lado a lado */
            align-items: center;    /* Centraliza verticalmente */
        }

        /* NOVO: Estilo da miniatura */
        .thumb-popup {
            width: 40px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 10px; /* Espaço entre imagem e texto */
        }

        /* NOVO: Container para o texto não bagunçar se for longo */
        .text-container {
            flex: 1; /* Ocupa o espaço restante */
            overflow: hidden;
        }

        .info-popup {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
        }
        .titulo-popup {
            font-size: 14px;
            white-space: nowrap; /* Não quebra linha */
            overflow: hidden;
            text-overflow: ellipsis; /* Adiciona "..." se for muito longo */
        }

        /* --- ESTILO DA GRADE DE ANIMES --- */
        .grade-animes { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 40px; }
        .card { background: white; width: 150px; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
        .titulo-card { font-size: 14px; font-weight: bold; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* PAGINAÇÃO */
        .paginacao { margin-top: 30px; margin-bottom: 50px; }
        .btn-nav { padding: 8px 15px; background: #333; color: white; text-decoration: none; border-radius: 4px; margin: 0 5px; }
        .btn-nav.disabled { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<h1>🎬 AnimeCom</h1>

<div class="search-wrapper">
    <input type="text" id="campoBusca" placeholder="Digite um anime..." autocomplete="off" onkeyup="acionarPopup()">
    <button onclick="irParaBusca()">Buscar</button>
    <div id="popup-resultados"></div>
</div>

<hr>

<div class="grade-animes">
    <div th:each="anime : ${listaDeAnimes.content}" class="card">
        <a th:href="@{/anime/{id}(id=${anime.id})}" style="text-decoration: none; color: inherit;">
            <img th:src="${anime.imagemUrl}" onerror="this.src='https://via.placeholder.com/150'">
            <p class="titulo-card" th:text="${anime.titulo}">Nome</p>
            <div style="font-size: 12px; color: orange;">
                ★ <span th:text="${anime.nota}"></span>
            </div>
        </a>
    </div>
</div>

<div class="paginacao">
    <a th:href="@{/(page=${paginaAtual - 1})}" class="btn-nav" th:classappend="${paginaAtual == 0} ? 'disabled'">⬅ Anterior</a>
    <span>Página <strong th:text="${paginaAtual + 1}"></strong></span>
    <a th:href="@{/(page=${paginaAtual + 1})}" class="btn-nav" th:classappend="${paginaAtual + 1 >= totalPaginas} ? 'disabled'">Próximo ➡</a>
</div>

<script>
    async function acionarPopup() {
        const texto = document.getElementById("campoBusca").value;
        const popup = document.getElementById("popup-resultados");

        if (texto.length < 2) {
            popup.style.display = "none";
            return;
        }

        try {
            const resposta = await fetch(`/api/popup?termo=${texto}`);
            const animes = await resposta.json();

            popup.innerHTML = "";

            if (animes.length > 0) {
                popup.style.display = "block";

                animes.forEach(anime => {
                    // --- AQUI ESTÁ A MÁGICA DO JAVASCRIPT ---
                    // Adicionei a tag <img> usando anime.imagemUrl
                    popup.innerHTML += `
                            <div class="item-popup">
                                <a href="/anime/${anime.id}">

                                    <img src="${anime.imagemUrl}" class="thumb-popup" onerror="this.src='https://via.placeholder.com/40x60?text=Sem+Foto'">

                                    <div class="text-container">
                                        <div class="titulo-popup"><strong>${anime.title}</strong></div>
                                        <div class="info-popup">
                                            ⭐ ${anime.score || '?'} | 📺 ${anime.episodes || '?'} eps
                                        </div>
                                    </div>
                                </a>
                            </div>
                        `;
                });
            } else {
                popup.style.display = "none";
            }
        } catch (erro) {
            console.error("Erro no popup:", erro);
        }
    }

    function irParaBusca() {
        const texto = document.getElementById("campoBusca").value;
        if (texto) { window.location.href = `/buscar?titulo=${texto}`; }
    }

    document.addEventListener('click', function(e) {
        const popup = document.getElementById("popup-resultados");
        const campo = document.getElementById("campoBusca");
        if (e.target !== campo && e.target !== popup) {
            popup.style.display = "none";
        }
    });
</script>

</body>
</html>
