<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AnimeCom - Home</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --score-color: #fbbf24;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* HEADER: Logo Gigante */
        .main-header {
            margin-top: 40px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }
        .logo-img {
            height: 150px;
            width: auto;
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5));
            transition: transform 0.3s;
        }
        .logo-img:hover { transform: scale(1.05); }

        /* SEÇÃO POPULARES */
        .populares-section {
            width: 100%;
            max-width: 1200px;
            margin: 20px 0;
            padding: 20px;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-left: 20px;
            border-left: 5px solid var(--score-color);
        }

        /* Contêiner do Carrossel com Barra Visível */
        .carousel-track-container {
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 15px;
            scroll-snap-type: x mandatory;
        }

        /* Estilização da Barra de Rolagem */
        .carousel-track-container::-webkit-scrollbar { height: 6px; }
        .carousel-track-container::-webkit-scrollbar-track { background: var(--card-bg); border-radius: 10px; }
        .carousel-track-container::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 10px; }

        .carousel-track {
            display: flex;
            gap: 20px;
            width: max-content;
        }

        .card-pop {
            width: 160px;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
            scroll-snap-align: start;
            transition: transform 0.3s;
        }
        .card-pop:hover { transform: translateY(-5px); }
        .card-pop img { width: 100%; height: 220px; object-fit: cover; }
        .rank-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--score-color);
            color: black;
            font-weight: bold;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            z-index: 2;
        }

        /* BUSCA E GRADE GERAL */
        .search-container {
            position: relative;
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
            margin-bottom: 30px;
        }
        input { background: transparent; border: none; color: white; padding: 10px; width: 300px; font-size: 16px; outline: none; }
        button.btn-search { background-color: var(--accent-color); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }

        #popup-resultados {
            position: absolute;
            top: 110%;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border-radius: 8px;
            z-index: 1000;
            display: none;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .item-popup { padding: 10px; border-bottom: 1px solid #334155; }
        .item-popup a { text-decoration: none; color: white; display: flex; align-items: center; gap: 10px; }

        .grade-animes { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; padding: 20px; max-width: 1200px; }
        .card { background: var(--card-bg); width: 180px; border-radius: 12px; overflow: hidden; transition: transform 0.3s; position: relative; }
        .card:hover { transform: translateY(-5px); }
        .card a { text-decoration: none; color: inherit; }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card-content { padding: 15px; }
        .titulo-card { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .badge-nota { background: rgba(251, 191, 36, 0.1); color: var(--score-color); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }

        .paginacao { margin: 20px 0 50px 0; display: flex; align-items: center; gap: 15px; }
        .btn-nav { background: var(--card-bg); color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; }
        .btn-nav.disabled { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<div class="main-header">
    <img th:src="@{/images/logo.png}" alt="AnimeCom" class="logo-img"
         onerror="this.style.display='none'; document.getElementById('fallback-emoji').style.display='block';">
    <span id="fallback-emoji" style="font-size: 100px; display: none;">🎬</span>
</div>

<div class="search-container">
    <input type="text" id="campoBusca" placeholder="Pesquisar animes..." autocomplete="off" onkeyup="acionarPopup()">
    <button class="btn-search" onclick="irParaBusca()">BUSCAR</button>
    <div id="popup-resultados"></div>
</div>

<div class="populares-section" th:if="${not #lists.isEmpty(listaPopulares)}">
    <h2 class="section-title">Mais Populares</h2>
    <div class="carousel-track-container" id="autoCarousel">
        <div class="carousel-track">
            <div th:each="pop, stats : ${listaPopulares}" class="card-pop">
                <a th:href="@{/anime/{id}(id=${pop.id})}">
                    <div class="rank-number" th:text="${stats.count}">#</div>
                    <img th:src="${pop.imagemUrl}" onerror="this.src='https://via.placeholder.com/160x220'">
                    <div class="card-content">
                        <p class="titulo-card" th:text="${pop.titulo}">Titulo</p>
                        <span class="badge-nota">★ <span th:text="${pop.nota ?: 'N/A'}"></span></span>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>

<div class="grade-animes">
    <div th:each="anime : ${listaDeAnimes.content}" class="card">
        <a th:href="@{/anime/{id}(id=${anime.id})}">
            <img th:src="${anime.imagemUrl}" onerror="this.src='https://via.placeholder.com/180x250'">
            <div class="card-content">
                <p class="titulo-card" th:text="${anime.titulo}">Titulo</p>
                <span class="badge-nota">★ <span th:text="${anime.nota ?: 'N/A'}"></span></span>
            </div>
        </a>
    </div>
</div>

<div class="paginacao">
    <a th:href="@{/(page=${paginaAtual - 1})}" class="btn-nav" th:classappend="${paginaAtual == 0} ? 'disabled'">Anterior</a>
    <span style="color: #94a3b8;">Página <strong style="color: white;" th:text="${paginaAtual + 1}">1</strong></span>
    <a th:href="@{/(page=${paginaAtual + 1})}" class="btn-nav" th:classappend="${paginaAtual + 1 >= totalPaginas} ? 'disabled'">Próxima</a>
</div>

<script>
    const track = document.getElementById('autoCarousel');
    const cardWidth = 180;
    const intervalTime = 2000; // Tempo reduzido para 2 segundos
    let autoScrollTimer;

    function stepScroll() {
        if (!track) return;

        // Lógica de Loop Infinito:
        // Se o scroll atual + a largura visível chegar perto do fim da largura total...
        if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 10) {
            // ...volta suavemente para o começo
            track.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
            // ...senão, pula para o próximo
            track.scrollBy({ left: cardWidth, behavior: 'smooth' });
        }
    }

    function startAutoScroll() {
        autoScrollTimer = setInterval(stepScroll, intervalTime);
    }

    if (track) {
        startAutoScroll();

        let isScrolling;
        track.addEventListener('scroll', function() {
            window.clearTimeout(isScrolling);
            clearInterval(autoScrollTimer);

            isScrolling = setTimeout(function() {
                // Reinicia o automático após 3 segundos parado manualmente
                startAutoScroll();
            }, 3000);
        });

        // Pausa ao encostar o mouse (hover) para facilitar o clique
        track.addEventListener('mouseenter', () => clearInterval(autoScrollTimer));
        track.addEventListener('mouseleave', () => {
            clearInterval(autoScrollTimer);
            startAutoScroll();
        });
    }

    // Script do Popup
    async function acionarPopup() {
        const texto = document.getElementById("campoBusca").value;
        const popup = document.getElementById("popup-resultados");
        if (texto.length < 2) { popup.style.display = "none"; return; }
        try {
            const res = await fetch(`/api/popup?termo=${texto}`);
            const animes = await res.json();
            popup.innerHTML = "";
            if (animes.length > 0) {
                popup.style.display = "block";
                animes.forEach(anime => {
                    popup.innerHTML += `<div class="item-popup"><a href="/anime/${anime.id}"><img src="${anime.imagemUrl}" style="width:40px;height:60px;object-fit:cover;border-radius:4px"><div><div style="font-weight:600">${anime.title}</div><div style="font-size:12px;color:#94a3b8">⭐ ${anime.score||'N/A'}</div></div></a></div>`;
                });
            } else { popup.style.display = "none"; }
        } catch (e) { console.error(e); }
    }

    function irParaBusca() {
        const val = document.getElementById("campoBusca").value;
        if(val) window.location.href = `/buscar?titulo=${val}`;
    }
</script>
</body>
</html>
